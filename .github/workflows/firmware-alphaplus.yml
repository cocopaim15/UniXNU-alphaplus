name: firmware-alphaplus

# Builds the Mu/UEFI firmware volume for this phone from Project-Aloha's
# mu_aloha_platforms plus UniXNU's DarwinBoot and payload, then packs a boot
# image with the kernel built by kernel-8796.yml.
#
# Linux runner on purpose: the kernel needs macOS/Xcode, the firmware does not.

on:
  workflow_dispatch:
    inputs:
      unixnu_sha:
        description: "UniXNU commit the ci/0019 patch is cut against"
        default: "40d21cc65171c3a24faa130a2a8e899f85790485"
      kernel_run_id:
        description: "Run id of the kernel-8796 run whose artifact to pack"
        required: true
      ipsw_url:
        description: "IPSW for prelink/ADT inputs"
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"

permissions:
  contents: read
  actions: read

env:
  UNIXNU_SHA: ${{ inputs.unixnu_sha }}

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Check out UniXNU (pinned) and apply ci/0019
        run: |
          git clone --quiet https://github.com/UniXNU/UniXNU.git unixnu
          git -C unixnu checkout -q "$UNIXNU_SHA"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/ci/0019-unixnu-8796-ci.patch"
          test -f unixnu/patches/xnu/zzzz-alphaplus-early-boot-probes.patch
          git -C unixnu log --oneline -1

      - name: Check out the Mu-Silicium fork UniXNU builds on (uefi-sheng)
        run: |
          git clone --quiet --depth 1 https://github.com/UniXNU/uefi-sheng.git uefi
          git -C uefi submodule update --init --depth 1 -- \
            Binaries Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
          # Mu_Basecore carries nested submodules (brotli, libspdm, mipisyst,
          # libfdt); MdePkg.dec resolves paths into them.
          git -C uefi/Mu_Basecore submodule update --init --depth 1 --recursive --jobs 4
          # overlay: the platform package and the ACPI tables this phone needs.
          # Copy the two trees, not firmware/uefi/. wholesale -- that would drop
          # our README over the checkout's own.
          cp -rv device/firmware/uefi/Platforms/. uefi/Platforms/
          cp -rv device/firmware/uefi/Silicium-ACPI/. uefi/Silicium-ACPI/
          # The DSDT is vendor-firmware derived and is not kept in this repository;
          # it comes from Project-Aloha's public lg-alpha tree at build time.
          curl -fsSL -o uefi/Silicium-ACPI/Platforms/LG/alphaplus/DSDT.aml \
            https://raw.githubusercontent.com/Project-Aloha/mu_aloha_platforms/main/Platforms/SurfaceDuo1Pkg/Device/lg-alpha/ACPI/DSDT.aml
          ls -l uefi/Silicium-ACPI/Platforms/LG/alphaplus/
          # The DSC resolves vendor UEFI drivers as `alphaplus/QcomPkg/...` inside
          # the Device-Binaries checkout. There is no alphaplus set upstream; the
          # G8X (mh2) set is the closest LG SM8150 package, so use it for the first
          # build and replace drivers as they prove wrong on the phone.
          test -d uefi/Binaries/mh2
          cp -r uefi/Binaries/mh2 uefi/Binaries/alphaplus
          # The borrowed set carries G8X file names (BATTERY_MH2LM.PROVISION and
          # friends); the platform package now asks for the alphaplus names.
          find uefi/Binaries/alphaplus -type f | while read -r f; do
            n=$(echo "$f" | sed 's/MH2LM/ALPHALM/g; s/mh2lm/alphalm/g; s/MH2/ALPHA/g; s/mh2/alphaplus/g')
            if [ "$f" != "$n" ]; then mv "$f" "$n"; fi
          done
          find uefi/Binaries/alphaplus -name '*.inf' | head -5
          ls uefi/Binaries/alphaplus/RawFiles | head -10
          cp device/firmware/alphaplus.toml uefi/Resources/Configs/alphaplus.toml
          cat uefi/Resources/Configs/alphaplus.toml
          ls uefi/Platforms/LG/alphaplusPkg
          ls uefi/Silicium-ACPI/Platforms/LG/alphaplus

      - name: Fetch the phone device tree (Project-Aloha lg-alpha)
        run: |
          curl -fsSL -o android-alpha.dtb \
            https://raw.githubusercontent.com/Project-Aloha/mu_aloha_platforms/main/Platforms/SurfaceDuo1Pkg/Device/lg-alpha/DeviceTreeBlob/Android/android-alpha.dtb
          # The published file is four concatenated DTBs (1,974,927 bytes, first
          # header says totalsize 499,866), which `unixnu bootimg` rejects as an
          # invalid compiled tree. Keep the first one, the base SM8150 tree.
          python3 -c "import struct;d=open('android-alpha.dtb','rb').read();n=struct.unpack_from('>I',d,4)[0];open('alpha-first.dtb','wb').write(d[:n]);print('first dtb',n,'of',len(d))"
          ls -l android-alpha.dtb alpha-first.dtb

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          # CLANGPDB needs lld-link, which ships in the lld package on Linux.
          sudo apt-get install -y -qq mtools nasm uuid-dev python3-pip \
            build-essential clang lld llvm
          mformat --version
          python3 --version
          command -v lld-link && lld-link --version | head -1
          clang --version | head -1

      - name: Fetch the kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-8796
          path: kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.kernel_run_id }}

      - name: Show what we have
        run: |
          find kernel -maxdepth 3 -type f | head -20
          ls -l kernel/kernel/ 2>/dev/null || true

      - name: Defconfig
        run: |
          cd unixnu
          python3 unixnu defconfig alphaplus_defconfig -D "$GITHUB_WORKSPACE/device"
          python3 unixnu status -D "$GITHUB_WORKSPACE/device" | head -40

      - name: Build the firmware volume
        run: |
          set -o pipefail
          cd unixnu
          python3 unixnu firmware -D "$GITHUB_WORKSPACE/device" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --kernel "$GITHUB_WORKSPACE/kernel/kernel/mach.development.bcm2837.unstripped" \
            --ipsw "${{ inputs.ipsw_url }}" \
            -j 4 2>&1 | tee firmware.log
          echo "--- artifacts ---"
          find "$GITHUB_WORKSPACE/uefi/Build" -name '*.fd' -o -name '*.fv' 2>/dev/null | head
          find out -maxdepth 4 -type f -size +1M 2>/dev/null | head -20

      - name: Pack the boot image
        run: |
          set -o pipefail
          cd unixnu
          FD=$(find "$GITHUB_WORKSPACE/uefi/Build" -name '*EFI.fd' -o -name '*.fd' | head -1)
          DTB="$GITHUB_WORKSPACE/alpha-first.dtb"
          echo "fd=$FD"
          echo "dtb=$DTB"
          test -n "$FD"
          python3 unixnu bootimg -D "$GITHUB_WORKSPACE/device" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --kernel "$GITHUB_WORKSPACE/kernel/kernel/mach.development.bcm2837.unstripped" \
            --ipsw "${{ inputs.ipsw_url }}" \
            --fd "$FD" --dtb "$DTB" -o "$GITHUB_WORKSPACE/boot-alphaplus.img" 2>&1 | tee bootimg.log
          ls -l "$GITHUB_WORKSPACE/boot-alphaplus.img"

      - name: Failure summary
        if: failure()
        run: |
          echo "=== last 120 lines of firmware.log ==="
          tail -n 120 firmware.log 2>/dev/null || true
          tail -n 120 bootimg.log 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -maxdepth 3 -name '*.log' | head -20

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-alphaplus
          if-no-files-found: warn
          retention-days: 7
          path: |
            boot-alphaplus.img
            firmware.log
            bootimg.log
