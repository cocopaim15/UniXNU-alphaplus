#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Project-Aloha lg-alpha PlatformMemoryMapLib:
#   {"UEFI FD", 0x9FC00000, 0x00300000}
# The FD must sit exactly where that map puts it.
[uefi_fd]
base = 0x9FC00000
size = 0x00300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 1
