#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Project-Aloha lg-alpha PlatformMemoryMapLib:
#   {"UEFI FD", 0x9FC00000, 0x00300000}
# The FD must sit exactly where that map puts it.
[uefi_fd]
base = 0x9FC00000
size = 0x00300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
# The working Project-Aloha image for this phone is uncompressed, and LG's abl
# fell straight back to fastboot with a gzip kernel. Write the shim + FD raw.
kernel_compression = "none"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 1
# UniXNU's bootimg reads `kernel_compression` from [boot_image] (settings() in
# scripts/unixnu/bootimg.py), not from [boot_image_kernel]; that section only
# feeds the Mu build. LG's abl fell back to fastboot with the gzip kernel, so
# write the BootShim + FD uncompressed.
kernel_compression = "none"
